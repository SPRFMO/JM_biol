project:
  type: default
  output-dir: docs
  render:
    - JM_biol.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    toc-location: left
    number-sections: true
    number-depth: 3
    code-fold: true
    html-math-method: katex
  pdf:
    number-sections: true
    number-depth: 3
    colorlinks: true
    geometry:
      - margin=1in

execute:
  echo: false
  warning: false
  message: false
